<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PixelBeetle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-signals="{bmp: null, deltas: [], lockAdds: [], lockRemoves: [], locks: [], metrics: {}}">
  <header>
    <h1>PixelBeetle</h1>
    <p class="tagline">every pixel is a TigerBeetle transfer</p>
    <div id="palette"></div>
    <div id="hud"></div>
    <span id="coords"></span>
    <a class="nav" href="/history">⏳ Timelapse</a>
  </header>

  <div id="canvas-wrap">
    <div id="canvas-stack">
      <canvas id="grid" width="{{.Cols}}" height="{{.Rows}}"
              data-init="@get('/sse', {openWhenHidden: true})"></canvas>
      <canvas id="lock-overlay"></canvas>
    </div>
    <div data-effect="pb.render($bmp, $deltas, $lockAdds, $lockRemoves, $locks)"></div>
  </div>

  <footer id="metrics-panel">
    <span>claims/s <b data-text="$metrics.claimsPerSec"></b></span>
    <span>confirms/s <b data-text="$metrics.confirmsPerSec"></b></span>
    <span>locks <b data-text="$metrics.locks"></b></span>
    <span>pixels <b data-text="$metrics.pixels"></b></span>
    <span>viewers <b data-text="$metrics.viewers"></b></span>
    <span class="bot" data-show="$metrics.botP99Ms != null">bot p50 <b data-text="$metrics.botP50Ms"></b>ms · p99 <b data-text="$metrics.botP99Ms"></b>ms · conflicts <b data-text="$metrics.botConflicts"></b></span>
  </footer>

  <script id="initial-state" type="application/json">{{.InitialJSON}}</script>
  <script src="/static/palette.js"></script>
  <script type="module" src="/static/datastar.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
